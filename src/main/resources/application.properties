spring.application.name=fplOptimizer

# database URL



# login credentials
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fpl_optimizer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate behavior
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

fpl.season=2026-2027
fpl.current-season=2026-2027